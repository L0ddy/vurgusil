name: GitHub Pages'e Yayınla


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4


      # Depo yapısı denetimi: dosyalar web arayüzünden sürüklenirken bir alt
      # klasöre yuvalanmışsa otomatik olarak köke taşınır. Kökte package.json
      # yoksa hata açıkça bildirilir (kör "failed" yerine).
      - name: Depo yapısını denetle
        run: |
          echo "=== Depo kök içeriği ==="
          ls -la
          if [ ! -f package.json ]; then
            SUB=$(find . -mindepth 2 -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1 | xargs -r dirname)
            if [ -n "$SUB" ]; then
              echo "package.json alt klasörde bulundu: $SUB — köke taşınıyor"
              (shopt -s dotglob; mv "$SUB"/* .)
              rmdir "$SUB" 2>/dev/null || true
              echo "=== Taşıma sonrası kök ==="
              ls -la
            else
              echo "::error::Depo kökünde package.json yok. Dosyaları alt klasöre değil, deponun ana dizinine yükleyin."
              exit 1
            fi
          fi


      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # npm install: kilit dosyası eksik ya da güncel değilse bile çalışır.
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund


      # --base=./ : uygulama hangi depo adıyla yayınlanırsa yayınlansın
      # (kullanici.github.io/depo-adi/) tüm yollar doğru çalışır.
      - name: Üretim derlemesi
        run: npx vite build --base=./


      # enablement: depoda Pages henüz açılmamışsa otomatik etkinleştirir —
      # "Get Pages site failed" hatasını kökten önler.
      - name: Pages yapılandırması
        uses: actions/configure-pages@v5
        with:
          enablement: true


      - name: Derlemeyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
