name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # YAPI DENETİMİ — web arayüzünden yüklemelerde dosyalar bazen bir alt
      # klasöre yuvalanır; bu adım onları otomatik köke taşır. Dosyalar
      # gerçekten eksikse neyin eksik olduğunu göstererek durur.
      - name: Depo yapısını denetle ve düzelt
        run: |
          if [ ! -f package.json ]; then
            SUBDIR="$(find . -mindepth 2 -maxdepth 3 -name package.json -not -path './node_modules/*' -printf '%h\n' | head -n 1)"
            if [ -n "$SUBDIR" ]; then
              echo "::warning::package.json '$SUBDIR' içinde bulundu — dosyalar köke taşınıyor"
              shopt -s dotglob
              mv -n "$SUBDIR"/* . 2>/dev/null || true
              shopt -u dotglob
            else
              echo "::error::Depo kökünde package.json bulunamadı. Tüm proje dosyalarını (src/, public/, index.html, package.json...) depo KÖKÜNE yüklediğinden emin ol."
              ls -la
              exit 1
            fi
          fi
          echo "--- depo kökü ---"
          ls -la

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install: kilit dosyası eksik ya da güncel değilse bile çalışır.
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      # --base=./ : uygulama hangi depo adıyla yayınlanırsa yayınlansın
      # (kullanici.github.io/depo-adi/) tüm yollar doğru çalışır.
      - name: Üretim derlemesi
        run: npx vite build --base=./

      - name: Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Derlemeyi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages henüz etkinleştirilmemişse otomatik açar —
          # "Get Pages site failed" hatasını kalıcı olarak çözer.
          enablement: true
